name: Android CI

on:
  push:
    branches: [main, master, spark-5.0]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: spark-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build Android variants
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests and assemble debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Run database migration instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -wipe-data
          disable-animations: true
          emulator-boot-timeout: 900
          cores: 2
          ram-size: 4096
          heap-size: 512
          script: bash .github/scripts/run-instrumentation-tests.sh

      - name: Build and verify stable-signed release APK
        id: signed_release
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_SIGNING_KEYSTORE_BASE64}" || -z "${ANDROID_SIGNING_STORE_PASSWORD}" || -z "${ANDROID_SIGNING_KEY_ALIAS}" || -z "${ANDROID_SIGNING_KEY_PASSWORD}" ]]; then
            echo "Stable signing secrets are not configured. No installable release APK will be published."
            echo "::warning::Configure the four ANDROID_SIGNING_* repository secrets to publish the update-capable APK."
            echo "SIGNED_RELEASE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/spark-release-signing.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          ANDROID_SIGNING_KEYSTORE_PATH="$KEYSTORE_PATH" gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Spark.apk

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/Spark.apk

          echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"

      - name: Upload update-capable Spark APK
        if: env.SIGNED_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Spark-install-update-apk
          path: app/build/outputs/apk/release/Spark.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK (development only)
        uses: actions/upload-artifact@v4
        with:
          name: Spark-debug-apk-dev-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Spark-instrumentation-diagnostics
          path: |
            app/build/outputs/androidTest-logcat.txt
            app/build/outputs/androidTest-results/connected/debug/
            app/build/reports/androidTests/connected/debug/
          if-no-files-found: ignore
          retention-days: 7
