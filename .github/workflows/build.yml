name: Android CI

on:
  push:
    branches: [main, master, spark-5.0]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: spark-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build Android variants
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests and assemble debug and release APKs
        run: gradle testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Run database migration instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 900
          cores: 2
          ram-size: 4096
          heap-size: 512
          script: |
            gradle connectedDebugAndroidTest --stacktrace --info || {
              mkdir -p app/build/outputs
              adb logcat -d -v threadtime > app/build/outputs/androidTest-logcat.txt
              exit 1
            }

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Spark-instrumentation-diagnostics
          path: |
            app/build/outputs/androidTest-logcat.txt
            app/build/reports/androidTests/connected/debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Spark-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: Spark-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
